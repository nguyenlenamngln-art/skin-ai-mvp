name: Train UVFD artifact U-Net V2

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/train_uvfd_v2.py"
      - "scripts/apply_uvfd_artifact_model.py"
      - ".github/workflows/train_uvfd_v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download official UVFD v2 dataset
        run: |
          curl -L --fail --retry 3 --retry-delay 5 \
            "https://data.mendeley.com/public-api/zip/wvmw7p76t8/download/2" -o uvfd.zip
          mkdir -p data/uvfd
          unzip -q uvfd.zip -d data/uvfd
      - name: Train V2
        run: |
          python scripts/train_uvfd_v2.py \
            --root data/uvfd --out artifacts/uvfd_train_v2 \
            --size 256 --batch 8 --epochs 6 --base 16 \
            --light-oversample 3.0
      - name: Upload V2
        uses: actions/upload-artifact@v4
        with:
          name: uvfd-train-v2
          path: artifacts/uvfd_train_v2
          if-no-files-found: error
          retention-days: 14
